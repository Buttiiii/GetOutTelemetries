name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell parse
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.PSParser]::Tokenize((Get-Content .\GetOutTelemetries.ps1 -Raw), [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List *; exit 1 }
          "Parse OK"

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path .\GetOutTelemetries.ps1 -Severity Warning,Error
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq Error) { exit 1 }

      - name: Self-test
        shell: pwsh
        run: .\GetOutTelemetries.ps1 -SelfTest

      - name: Required files
        shell: pwsh
        run: |
          foreach ($file in @('README.md','SECURITY.md','CHANGELOG.md','LICENSE')) {
            if (-not (Test-Path $file)) { throw "Missing $file" }
          }

      - name: Forbidden local strings
        shell: pwsh
        run: |
          $patterns = @(
            ('C:' + '\Users'),
            ('C:' + '\\' + 'Users'),
            ('al' + 'exc'),
            ('One' + 'Drive'),
            ('Datos' + ' adjuntos'),
            ('Cursor' + ' Raton'),
            ('Archivos de' + ' Progama'),
            ('Pro' + 'yectos')
          )
          $files = Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch '\\.git\\' }
          $failed = $false
          foreach ($file in $files) {
            $text = Get-Content -LiteralPath $file.FullName -Raw
            foreach ($pattern in $patterns) {
              if ($text -like "*$pattern*") {
                Write-Error "Forbidden string found in $($file.FullName): $pattern"
                $failed = $true
              }
            }
          }
          if ($failed) { exit 1 }
